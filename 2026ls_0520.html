<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>報名表單產生器｜質穎形象顏究室®</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#F5EFE9;font-family:'Noto Sans TC',Georgia,sans-serif;padding:2rem 1rem;min-height:100vh}
.wrap{max-width:620px;margin:0 auto}

.page-header{text-align:center;margin-bottom:2rem;padding:1.5rem 0}
.page-logo{font-family:Georgia,serif;font-size:13px;color:#E8784A;letter-spacing:3px;margin-bottom:0.4rem}
.page-title{font-size:18px;color:#3A2E28;font-weight:400;letter-spacing:1px}
.page-sub{font-size:12px;color:#A08070;margin-top:0.3rem}

.card{background:#FFFCFA;border-radius:14px;border:1px solid #e0d6cf;padding:1.5rem 1.8rem;margin-bottom:1.2rem}
.section-label{font-size:10px;letter-spacing:3.5px;color:#E8784A;margin-bottom:1rem;font-weight:500}
.field{margin-bottom:1.1rem}
.field label{display:block;font-size:12px;color:#6B5A52;margin-bottom:6px}
.fw-input{width:100%;border:1px solid #d5c8be;border-radius:8px;padding:10px 14px;font-size:13.5px;color:#3A2E28;background:#FAF6F3;font-family:'Noto Sans TC',sans-serif;outline:none;transition:border-color 0.2s}
.fw-input:focus{border-color:#E8784A}
.fw-input::placeholder{color:#C4B0A4}
select.fw-input{cursor:pointer}
.weekday-note{font-size:11px;color:#E8784A;margin-top:4px;font-weight:500;min-height:16px}
.divider{height:1px;background:#ede3db;margin:1.2rem 0}

.session-grid{display:grid;grid-template-columns:1fr 1fr;gap:0.8rem}
.session-field label{display:block;font-size:12px;color:#6B5A52;margin-bottom:6px}
.session-note{font-size:11px;color:#E8784A;margin-top:4px;font-weight:500;min-height:16px}

.style-grid{display:grid;grid-template-columns:1fr 1fr;gap:0.8rem}
.style-card{border:1.5px solid #d5c8be;border-radius:10px;padding:0.85rem;cursor:pointer;transition:all 0.2s;user-select:none;background:#FAF6F3}
.style-card:hover{border-color:#E8784A}
.style-card.selected{border-color:#E8784A;background:#fff8f5}
.style-preview{border-radius:6px;overflow:hidden;margin-bottom:0.6rem;height:48px;display:flex}
.style-preview-full{background:#E8784A;width:100%}
.style-preview-left{background:#E8784A;flex:1.1}
.style-preview-right{background:#FAF6F3;flex:0.9;border-left:2px solid rgba(232,120,74,0.4)}
.style-name{font-size:12.5px;font-weight:500;color:#3A2E28;margin-bottom:2px}
.style-desc{font-size:11px;color:#A08070}

.agenda-row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.agenda-num{font-family:Georgia,serif;font-size:13px;color:#E8784A;min-width:22px;font-weight:400}
.agenda-row .fw-input{font-size:13px;padding:8px 12px}

.item-list{display:flex;flex-direction:column;gap:5px;margin-bottom:8px}
.item-row{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid #d5c8be;border-radius:8px;background:#FAF6F3;transition:all 0.15s}
.item-row.checked{border-color:#E8784A;background:#fff8f5}
.item-check{width:16px;height:16px;min-width:16px;border:1.5px solid #d5c8be;border-radius:3px;background:white;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all 0.15s;flex-shrink:0}
.item-row.checked .item-check{background:#E8784A;border-color:#E8784A}
.item-checkmark{width:8px;height:5px;border-left:1.5px solid white;border-bottom:1.5px solid white;transform:rotate(-45deg) translateY(-1px);display:none}
.item-row.checked .item-checkmark{display:block}
.item-text{flex:1;font-size:12.5px;color:#6B5A52;line-height:1.4;cursor:pointer}
.item-row.checked .item-text{color:#3A2E28}
.item-edit-input{flex:1;padding:3px 8px;border:1px solid #E8784A;border-radius:5px;font-size:12.5px;color:#3A2E28;background:white;outline:none;font-family:'Noto Sans TC',sans-serif;display:none}
.item-actions{display:flex;gap:4px;flex-shrink:0}
.action-btn{padding:4px 9px;border:1px solid #d5c8be;border-radius:5px;font-size:11px;cursor:pointer;background:white;color:#8A8078;font-family:'Noto Sans TC',sans-serif;transition:all 0.15s;white-space:nowrap}
.action-btn:hover{border-color:#E8784A;color:#E8784A}
.action-btn.del:hover{border-color:#c0392b;color:#c0392b}
.action-btn.save-btn{background:#E8784A;color:#fff;border-color:#E8784A}
.action-btn.save-btn:hover{background:#d46a3c}

.add-row{display:flex;gap:8px;margin-top:6px}
.add-input{flex:1;padding:9px 12px;border:1px solid #d5c8be;border-radius:8px;font-size:13px;color:#3A2E28;background:#FAF6F3;outline:none;font-family:'Noto Sans TC',sans-serif;transition:border-color 0.2s}
.add-input:focus{border-color:#E8784A}
.add-input::placeholder{color:#C4B0A4}
.add-btn{padding:9px 16px;background:#E8784A;color:#fff;border:none;border-radius:8px;font-size:12.5px;font-weight:500;cursor:pointer;font-family:'Noto Sans TC',sans-serif;white-space:nowrap;transition:background 0.2s}
.add-btn:hover{background:#d46a3c}
.add-hint{font-size:11px;color:#A08070;margin-top:5px;line-height:1.6}

.steps{display:flex;flex-direction:column;gap:0}
.step{display:flex;align-items:flex-start;gap:12px;padding:0.7rem 0;border-bottom:1px solid #ede3db}
.step:last-child{border-bottom:none}
.step-num{width:24px;height:24px;min-width:24px;border-radius:50%;background:#E8784A;color:#fff;font-size:11.5px;font-weight:500;display:flex;align-items:center;justify-content:center;margin-top:1px}
.step-text{font-size:13px;color:#6B5A52;line-height:1.5;padding-top:3px}

.generate-btn{width:100%;padding:15px;background:#E8784A;color:white;border:none;border-radius:10px;font-size:14.5px;font-family:'Noto Sans TC',sans-serif;cursor:pointer;letter-spacing:1px;transition:background 0.2s;margin-bottom:0.75rem}
.generate-btn:hover{background:#d46a3c}
.generate-btn:active{transform:scale(0.99)}
.hint-msg{font-size:12px;text-align:center;line-height:1.6;min-height:20px;color:#6B5A52}
.reset-link{display:block;text-align:center;font-size:11px;color:#C4B0A4;margin-top:1rem;cursor:pointer;text-decoration:underline}
.reset-link:hover{color:#A08070}
</style>
</head>
<body>
<div class="wrap">

  <div class="page-header">
    <div class="page-logo">Floral Way · 質穎形象顏究室®</div>
    <div class="page-title">報名表單產生器</div>
    <div class="page-sub">填好資訊，一鍵下載 HTML，丟進 Netlify 就完成</div>
  </div>

  <div class="card">
    <div class="section-label">場次日期</div>
    <div style="font-size:11px;color:#A08070;margin-bottom:0.9rem">填一個日期為單場；填兩個日期學員可選擇場次</div>
    <div class="session-grid">
      <div class="session-field">
        <label>第一場日期</label>
        <input type="date" id="sessionDate1" class="fw-input" oninput="updateNote('1')">
        <div class="session-note" id="sessionNote1"></div>
      </div>
      <div class="session-field">
        <label>第二場日期<span style="color:#C4B0A4;font-size:10px;margin-left:6px">（選填）</span></label>
        <input type="date" id="sessionDate2" class="fw-input" oninput="updateNote('2')">
        <div class="session-note" id="sessionNote2"></div>
      </div>
    </div>

    <div class="field" style="margin-top:0.5rem">
      <label>開播時間（兩場相同）</label>
      <select id="sessionTime" class="fw-input">
        <option value="21:00">晚上 9:00</option>
        <option value="20:00">晚上 8:00</option>
        <option value="20:30">晚上 8:30</option>
        <option value="19:00">晚上 7:00</option>
      </select>
    </div>

    <div class="divider"></div>
    <div class="section-label">表頭風格</div>
    <div class="style-grid">
      <div class="style-card" id="style-full" onclick="selectStyle('full')">
        <div class="style-preview"><div class="style-preview-full"></div></div>
        <div class="style-name">全橘色</div>
        <div class="style-desc">溫暖鮮明</div>
      </div>
      <div class="style-card selected" id="style-split" onclick="selectStyle('split')">
        <div class="style-preview"><div class="style-preview-left"></div><div class="style-preview-right"></div></div>
        <div class="style-name">左右分割</div>
        <div class="style-desc">現代簡潔</div>
      </div>
    </div>

    <div class="divider"></div>
    <div class="section-label">直播主題</div>
    <div class="field">
      <label>主標題</label>
      <input type="text" id="sessionTitle" class="fw-input" placeholder="例如：你有分析報告，但你還是不知道怎麼穿？">
    </div>
    <div class="field">
      <label>副標語</label>
      <input type="text" id="sessionSub" class="fw-input" placeholder="一句話說這場的核心">
    </div>

    <div class="divider"></div>
    <div class="section-label">直播大綱（三條）</div>
    <div style="font-size:11px;color:#A08070;margin-bottom:0.75rem">引起興趣就好，不用破題</div>
    <div class="agenda-row"><div class="agenda-num">01</div><input type="text" id="agenda1" class="fw-input" placeholder="第一條大綱"></div>
    <div class="agenda-row"><div class="agenda-num">02</div><input type="text" id="agenda2" class="fw-input" placeholder="第二條大綱"></div>
    <div class="agenda-row"><div class="agenda-num">03</div><input type="text" id="agenda3" class="fw-input" placeholder="第三條大綱"></div>
  </div>

  <div class="card">
    <div class="section-label">這場直播適合的人
      <span style="font-size:10px;color:#A08070;letter-spacing:0;font-weight:400">（勾選要放進表單的）</span>
    </div>
    <div class="item-list" id="audienceList"></div>
    <div class="add-row">
      <input class="add-input" type="text" id="audienceNew" placeholder="新增一條……">
      <button class="add-btn" onclick="addItem()">+ 新增</button>
    </div>
    <div class="add-hint">新增、編輯、刪除都會自動存起來，下次打開還在</div>
  </div>

  <div class="card">
    <div class="section-label">操作步驟</div>
    <div class="steps">
      <div class="step"><div class="step-num">1</div><div class="step-text">填好兩個場次日期、主題和大綱</div></div>
      <div class="step"><div class="step-num">2</div><div class="step-text">點「產生並下載表單」</div></div>
      <div class="step"><div class="step-num">3</div><div class="step-text">把下載的 HTML 丟進 Netlify</div></div>
      <div class="step"><div class="step-num">4</div><div class="step-text">完成！Google Sheet 自動建立新分頁</div></div>
    </div>
  </div>

  <button class="generate-btn" onclick="generateForm()">產生並下載表單 →</button>
  <div class="hint-msg" id="hintMsg"></div>
  <div class="reset-link" onclick="resetAll()">重置所有選項為預設值</div>

</div>

<script>
const WEEKDAYS = ['日','一','二','三','四','五','六'];
const TIMES = {'21:00':'晚上 9:00','20:00':'晚上 8:00','20:30':'晚上 8:30','19:00':'晚上 7:00'};
let currentStyle = 'split';

const DEFAULT_AUDIENCE = [
  '做過色彩或骨架分析，但還是穿不出感覺',
  '有報告書，卻不知道從哪一步開始',
  '買了建議色，穿起來還是哪裡怪',
  '分析完很有感，兩週後又回到原點',
  '衣櫃很滿，每次出門卻覺得沒衣服穿',
  '以前穿還好，現在怎麼穿都怪',
  '升職、當媽、創業後找不到方向',
  '一直靠別人推薦，沒有自己的邏輯',
  '想穿出自己的樣子，不是別人的版本',
];

function loadItems() {
  try {
    const s = localStorage.getItem('fw_gen_audience');
    if (s) return JSON.parse(s);
  } catch(e) {}
  return DEFAULT_AUDIENCE.map(t => ({text: t, checked: true}));
}
function saveItems(items) {
  try { localStorage.setItem('fw_gen_audience', JSON.stringify(items)); } catch(e) {}
}

let audienceItems = loadItems();

function renderList() {
  const list = document.getElementById('audienceList');
  list.innerHTML = '';
  audienceItems.forEach((item, i) => {
    const row = document.createElement('div');
    row.className = 'item-row' + (item.checked ? ' checked' : '');

    const check = document.createElement('div');
    check.className = 'item-check';
    check.innerHTML = '<div class="item-checkmark"></div>';
    check.onclick = () => { audienceItems[i].checked = !audienceItems[i].checked; saveItems(audienceItems); renderList(); };

    const textEl = document.createElement('div');
    textEl.className = 'item-text';
    textEl.textContent = item.text;
    textEl.onclick = () => { audienceItems[i].checked = !audienceItems[i].checked; saveItems(audienceItems); renderList(); };

    const editInput = document.createElement('input');
    editInput.className = 'item-edit-input';
    editInput.value = item.text;

    const actions = document.createElement('div');
    actions.className = 'item-actions';

    const editBtn = document.createElement('button');
    editBtn.className = 'action-btn';
    editBtn.textContent = '編輯';
    editInput.onkeydown = e => { if (e.key === 'Enter') editBtn.click(); };
    editBtn.onclick = () => {
      if (editInput.style.display === 'block') {
        const newText = editInput.value.trim();
        if (newText) { audienceItems[i].text = newText; saveItems(audienceItems); renderList(); }
      } else {
        textEl.style.display = 'none';
        editInput.style.display = 'block';
        editInput.focus(); editInput.select();
        editBtn.textContent = '儲存';
        editBtn.classList.add('save-btn');
      }
    };

    const delBtn = document.createElement('button');
    delBtn.className = 'action-btn del';
    delBtn.textContent = '刪除';
    delBtn.onclick = () => { audienceItems.splice(i, 1); saveItems(audienceItems); renderList(); };

    actions.appendChild(editBtn);
    actions.appendChild(delBtn);
    row.appendChild(check);
    row.appendChild(textEl);
    row.appendChild(editInput);
    row.appendChild(actions);
    list.appendChild(row);
  });
}

function addItem() {
  const inputEl = document.getElementById('audienceNew');
  const text = inputEl.value.trim();
  if (!text) return;
  audienceItems.push({text, checked: true});
  saveItems(audienceItems);
  renderList();
  inputEl.value = '';
  inputEl.focus();
}

document.getElementById('audienceNew').addEventListener('keydown', e => { if (e.key === 'Enter') addItem(); });

function parseDate(d) {
  if (!d) return null;
  const dt = new Date(d + 'T12:00:00');
  return {
    m: dt.getMonth() + 1,
    day: dt.getDate(),
    wd: WEEKDAYS[dt.getDay()],
    key: String(dt.getMonth()+1).padStart(2,'0') + String(dt.getDate()).padStart(2,'0')
  };
}

function updateNote(num) {
  const d = document.getElementById('sessionDate' + num).value;
  const note = document.getElementById('sessionNote' + num);
  if (d) {
    const p = parseDate(d);
    note.textContent = p.m + ' 月 ' + p.day + ' 日（週' + p.wd + '）';
  } else note.textContent = '';
}

function selectStyle(s) {
  currentStyle = s;
  document.getElementById('style-full').classList.toggle('selected', s === 'full');
  document.getElementById('style-split').classList.toggle('selected', s === 'split');
}

function resetAll() {
  if (!confirm('確定要重置所有選項為預設值嗎？')) return;
  localStorage.removeItem('fw_gen_audience');
  audienceItems = DEFAULT_AUDIENCE.map(t => ({text: t, checked: true}));
  renderList();
}

renderList();

function generateForm() {
  const d1 = document.getElementById('sessionDate1').value;
  const d2 = document.getElementById('sessionDate2').value;
  const t  = document.getElementById('sessionTime').value;
  const title = document.getElementById('sessionTitle').value.trim();
  const sub   = document.getElementById('sessionSub').value.trim();
  const a1 = document.getElementById('agenda1').value.trim();
  const a2 = document.getElementById('agenda2').value.trim();
  const a3 = document.getElementById('agenda3').value.trim();
  const hint = document.getElementById('hintMsg');
  const selAudience = audienceItems.filter(i => i.checked);

  hint.style.color = '#d85a30';
  if (!d1)           { hint.textContent = '請填寫第一場場次日期！'; return; }
  if (!title)        { hint.textContent = '請填寫直播主題標題！'; return; }
  if (!a1||!a2||!a3) { hint.textContent = '請填寫三條直播大綱！'; return; }
  if (!selAudience.length) { hint.textContent = '請至少勾選一條「適合的人」！'; return; }

  const p1 = parseDate(d1);
  const p2 = d2 ? parseDate(d2) : null;
  const timeLabel = TIMES[t] || t;

  // 單場或雙場
  const chipDate   = p2 ? p1.m + ' / ' + p1.day + ' & ' + p2.m + ' / ' + p2.day : p1.m + ' / ' + p1.day;
  const sessionKey = p2 ? p1.key + '_' + p2.key : p1.key;

  const s1Label = p1.m + ' 月 ' + p1.day + ' 日（週' + p1.wd + '）' + timeLabel;
  const s2Label = p2 ? p2.m + ' 月 ' + p2.day + ' 日（週' + p2.wd + '）' + timeLabel : '';

  const titleBr = title.replace(/，/g, '，<br>');
  const audienceTags = selAudience.map(i => `<div class="fw-tag"><span class="fw-dot"></span>${i.text}</div>`).join('\n      ');

  const headerCSS = currentStyle === 'full' ? `
  .fw-header{background:#E8784A;border-radius:14px;padding:2.4rem 2rem 2rem;margin-bottom:1.5rem;position:relative;overflow:hidden}
  .fw-header::before{content:'FLORAL';position:absolute;right:-10px;top:50%;transform:translateY(-50%);font-family:Georgia,serif;font-size:90px;color:rgba(255,255,255,0.09);letter-spacing:8px;pointer-events:none;white-space:nowrap}
  .fw-eyebrow{font-size:10px;letter-spacing:4px;color:rgba(255,255,255,0.75);margin-bottom:0.85rem}
  .fw-title{font-family:Georgia,serif;font-size:24px;color:#fff;font-weight:400;line-height:1.45;margin-bottom:0.7rem}
  .fw-bar{height:1.5px;background:rgba(255,255,255,0.35);margin:1rem 0}
  .fw-sub{font-family:Georgia,serif;font-size:13px;color:rgba(255,255,255,0.85);font-style:italic;line-height:1.65}
  .fw-meta{display:flex;gap:0.75rem;flex-wrap:wrap;margin-top:1.1rem}
  .fw-chip{background:rgba(255,255,255,0.18);border:1px solid rgba(255,255,255,0.35);border-radius:20px;padding:4px 14px;font-size:11px;color:#fff}
  .fw-chip-date{background:rgba(255,255,255,0.3);border:1px solid rgba(255,255,255,0.5);border-radius:20px;padding:4px 14px;font-size:11px;color:#fff;font-weight:500}` : `
  .fw-header{border-radius:14px;margin-bottom:1.5rem;overflow:hidden;display:flex;min-height:200px}
  .fw-header-left{background:#E8784A;flex:1.1;padding:2.2rem 1.8rem;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:center}
  .fw-header-left::before{content:'F';position:absolute;right:-10px;bottom:-20px;font-family:Georgia,serif;font-size:140px;color:rgba(255,255,255,0.1);pointer-events:none;line-height:1}
  .fw-header-right{background:#FAF6F3;flex:0.9;padding:2.2rem 1.6rem;display:flex;flex-direction:column;justify-content:center;position:relative}
  .fw-header-right::before{content:'';position:absolute;left:0;top:1.5rem;bottom:1.5rem;width:1.5px;background:#E8784A;opacity:0.4}
  .fw-eyebrow{font-size:10px;letter-spacing:4px;color:rgba(255,255,255,0.75);margin-bottom:0.85rem}
  .fw-title{font-family:Georgia,serif;font-size:22px;color:#fff;font-weight:400;line-height:1.5}
  .fw-bar{height:1.5px;background:rgba(255,255,255,0.35);margin:1rem 0}
  .fw-sub{font-family:Georgia,serif;font-size:12.5px;color:#6B5A52;font-style:italic;line-height:1.7;margin-bottom:1rem}
  .fw-meta{display:flex;gap:0.55rem;flex-wrap:wrap}
  .fw-chip{background:#FAF7F4;border:1px solid #E8E0D8;border-radius:20px;padding:4px 12px;font-size:11px;color:#8A8078}
  .fw-chip-date{background:#E8784A;border:1px solid #E8784A;border-radius:20px;padding:4px 12px;font-size:11px;color:#fff;font-weight:500}`;

  const mobileCSS = currentStyle === 'full'
    ? `@media(max-width:480px){.fw-for{grid-template-columns:1fr}.fw-sessions{grid-template-columns:1fr}.fw-title{font-size:20px}.fw-header::before{display:none}}`
    : `@media(max-width:480px){.fw-header{flex-direction:column}.fw-header-right::before{display:none}.fw-for,.fw-sessions{grid-template-columns:1fr}}`;

  const headerHTML = currentStyle === 'full' ? `
  <div class="fw-header">
    <div class="fw-eyebrow">直播免費報名  ·  質穎形象顏究室®</div>
    <div class="fw-title">${titleBr}</div>
    <div class="fw-bar"></div>
    <div class="fw-sub">${sub}</div>
    <div class="fw-meta"><span class="fw-chip-date">${chipDate}</span><span class="fw-chip">免費入場</span><span class="fw-chip">直播限定</span></div>
  </div>` : `
  <div class="fw-header">
    <div class="fw-header-left">
